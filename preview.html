<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CogniCode — README Preview</title>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d0d7de;
    --code-bg: #f6f8fa;
    --accent: #0969da;
    --accent-bg: #ddf4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --code-bg: #161b22;
      --accent: #58a6ff;
      --accent-bg: #1f6feb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.65;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3fb950; box-shadow: 0 0 0 3px rgba(63,185,80,.2);
  }
  .topbar .brand { font-weight: 700; font-size: 14px; }
  .topbar .sub { color: var(--muted); font-size: 12px; }
  .topbar .badge {
    margin-left: auto;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  #markdown-body { font-size: 15px; }
  #markdown-body h1, #markdown-body h2, #markdown-body h3 { line-height: 1.3; margin-top: 1.6em; }
  #markdown-body h1 {
    font-size: 2em;
    padding-bottom: 0.4em;
    border-bottom: 1px solid var(--border);
  }
  #markdown-body h2 {
    font-size: 1.45em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid var(--border);
  }
  #markdown-body a { color: var(--accent); text-decoration: none; }
  #markdown-body a:hover { text-decoration: underline; }
  #markdown-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 5px;
  }
  #markdown-body pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  #markdown-body pre code { background: none; padding: 0; }
  #markdown-body blockquote {
    margin: 0;
    padding: 2px 16px;
    border-left: 4px solid var(--border);
    color: var(--muted);
  }
  #markdown-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
  }
  #markdown-body th, #markdown-body td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  #markdown-body th { background: var(--code-bg); }
  #markdown-body img { max-width: 100%; }
  .mermaid {
    margin: 24px 0;
    display: flex;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
  }
  .mermaid svg { max-width: 100%; height: auto; }
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    color: var(--muted);
    font-size: 14px;
  }
  .error-banner {
    background: #ffebe9;
    border: 1px solid #ffcecb;
    color: #cf222e;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="dot"></span>
    <span class="brand">CogniCode</span>
    <span class="sub">README.md preview</span>
    <span class="badge">Markdown + Mermaid (no external CDN)</span>
  </div>
  <div class="container">
    <div id="error" class="error-banner" hidden></div>
    <div id="loading" class="loading">Loading README…</div>
    <div id="markdown-body" hidden></div>
  </div>

<script>
  (function () {
    const loading = document.getElementById('loading');
    const bodyEl = document.getElementById('markdown-body');
    const errEl = document.getElementById('error');
    function fail(msg) {
      errEl.textContent = msg;
      errEl.hidden = false;
      loading.hidden = true;
    }

    try {
      if (typeof marked === 'undefined') fail('marked library failed to load from /vendor/marked.min.js');
      if (typeof mermaid === 'undefined') fail('mermaid library failed to load from /vendor/mermaid.min.js');
    } catch (e) { fail('Library check error: ' + e.message); }

    fetch('./README.md')
      .then(function (res) {
        if (!res.ok) throw new Error('README fetch failed: ' + res.status);
        return res.text();
      })
      .then(function (text) {
        const rendered = marked.parse(text, { gfm: true, breaks: false });
        bodyEl.innerHTML = rendered;
        bodyEl.hidden = false;
        loading.hidden = true;

        bodyEl.querySelectorAll('pre > code.language-mermaid').forEach(function (codeEl) {
          const source = codeEl.textContent;
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = source;
          codeEl.parentNode.replaceWith(div);
        });

        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'loose',
          theme: 'base',
          flowchart: { htmlLabels: true, useMaxWidth: true },
        });
        return mermaid.run({ querySelector: '.mermaid' });
      })
      .catch(function (e) {
        fail('Render error: ' + e.message);
        console.error(e);
      });
  })();
</script>
</body>
</html>
